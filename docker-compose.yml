services:
  # ── Database ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: zenportal-db
    restart: unless-stopped
    command: -p ${DB_PORT:-5432}
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-zenportal}
    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}", "-p", "${DB_PORT:-5432}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend ───────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: zenportal-backend
    restart: unless-stopped
    expose:
      - "${BACKEND_PORT:-3000}"
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:${DB_PORT:-5432}/${DB_NAME:-zenportal}"
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      VISITOR_SALT: ${VISITOR_SALT:-}
      MEDIA_MAX_IMAGE_SIZE_MB: ${MEDIA_MAX_IMAGE_SIZE_MB:-10}
      MEDIA_MAX_VIDEO_SIZE_MB: ${MEDIA_MAX_VIDEO_SIZE_MB:-50}
      MEDIA_MAX_AUDIO_SIZE_MB: ${MEDIA_MAX_AUDIO_SIZE_MB:-10}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/app/storage
      - backups_data:/app/backups

  # ── Frontend (nginx + static build) ───────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        BACKEND_PORT: ${BACKEND_PORT:-3000}
    container_name: zenportal-frontend
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
    depends_on:
      - backend

volumes:
  pgdata:
  media_data:
  backups_data:
